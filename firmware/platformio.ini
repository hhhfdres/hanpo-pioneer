[platformio]
default_envs = blackpill_f411ce
src_dir = .

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -I core/include
build_src_filter =
    +<stm32f411/>
    +<core/src/core.cpp>
