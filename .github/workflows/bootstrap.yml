name: Bootstrap repository tree

on:
  push:
    paths:
      - bootstrap.tar.gz

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace flattened upload with archive tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hanpo-tree"
          tar -xzf bootstrap.tar.gz -C "$RUNNER_TEMP/hanpo-tree"
          git rm -r --ignore-unmatch -- .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/hanpo-tree/." .
          rm -f bootstrap.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore HanPo Pioneer repository tree"
          git push

