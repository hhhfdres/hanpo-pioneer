[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanpo-pioneer"
version = "0.1.0"
description = "Open reference platform for the HanPo Pioneer intelligent thermal protection equipment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "HanPo Pioneer contributors"}
]
keywords = ["iot", "thermal-control", "search-and-rescue", "beidou", "embedded"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: C++",
]
dependencies = []

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "numpy>=1.23",
  "scikit-learn>=1.2",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[project.scripts]
hanpo-demo = "hanpo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

