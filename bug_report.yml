name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, request bodies, or the simulator scenario used.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python service
        - Dashboard
        - Firmware core
        - STM32 integration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: State whether heating, power, alerting, or rescue messaging can be affected.
    validations:
      required: true

